# ════════════════════════════════════════════════════════════
#  Estado de Elysium
#  Va en el repo, en la carpeta:  .github/workflows/
#  Consulta el servidor desde las máquinas de GitHub (que están
#  fuera de tu red) y guarda el resultado en estado.json.
#  La web lee ese archivo desde su propio dominio: sin CORS,
#  sin proxies y sin depender de que Cloudflare deje pasar.
# ════════════════════════════════════════════════════════════
name: Estado del servidor

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos
  workflow_dispatch:          # y cuando lo dispares a mano

permissions:
  contents: write

concurrency:
  group: estado
  cancel-in-progress: true

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar el servidor
        id: consulta
        run: |
          JOIN="kr546a"
          IP="190.55.54.67:30120"
          CLIENTS=""; MAX=""; VIA=""

          echo "──────── 1. API de Cfx.re ────────"
          if curl -sS -m 20 -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" \
               "https://servers-frontend.fivem.net/api/servers/single/$JOIN" -o cfx.json; then
            CLIENTS=$(jq -r '.Data.clients // empty' cfx.json 2>/dev/null)
            MAX=$(jq -r '.Data.sv_maxclients // .Data.svMaxclients // empty' cfx.json 2>/dev/null)
            [ -n "$CLIENTS" ] && VIA="cfx"
            echo "clients=$CLIENTS max=$MAX"
          else
            echo "no respondió"
          fi

          if [ -z "$CLIENTS" ]; then
            echo "──────── 2. Tu IP directa ────────"
            echo "Si esto responde, el puerto está abierto hacia afuera."
            if curl -sS -m 20 -w "\nHTTP %{http_code}\n" "http://$IP/dynamic.json" -o dyn.json; then
              CLIENTS=$(jq -r '.clients // empty' dyn.json 2>/dev/null)
              MAX=$(jq -r '.sv_maxclients // empty' dyn.json 2>/dev/null)
              [ -n "$CLIENTS" ] && VIA="ip"
              echo "clients=$CLIENTS max=$MAX"
            else
              echo "no respondió: la IP cambió o el puerto 30120 está cerrado desde afuera"
            fi
          fi

          AHORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -z "$CLIENTS" ]; then
            printf '{"en_linea":false,"actualizado":"%s"}\n' "$AHORA" > estado.json
          else
            printf '{"en_linea":true,"jugadores":%s,"tope":%s,"via":"%s","actualizado":"%s"}\n' \
              "$CLIENTS" "${MAX:-64}" "$VIA" "$AHORA" > estado.json
          fi

          echo "──────── resultado ────────"
          cat estado.json
          echo "${CLIENTS:-vacio}" > .jugadores

      - name: Publicar solo si cambió el número
        run: |
          NUEVO=$(cat .jugadores); rm -f .jugadores cfx.json dyn.json
          VIEJO=$(git show HEAD:estado.json 2>/dev/null | jq -r '.jugadores // "vacio"' 2>/dev/null || echo "sin-archivo")

          if [ "$NUEVO" = "$VIEJO" ]; then
            echo "Sigue en $NUEVO jugadores: no hace falta publicar."
            exit 0
          fi

          git config user.name  "Elysium bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "Estado: $NUEVO jugadores"
          git push
