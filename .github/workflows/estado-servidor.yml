# ════════════════════════════════════════════════════════════
#  Estado de Elysium
#  Consulta el servidor desde las máquinas de GitHub y deja el
#  resultado en estado.json, que la web lee desde su propio dominio.
#  El navegador de quien visita el sitio nunca consulta el servidor
#  ni servicios de terceros.
#
#  Fuentes, en orden:
#   1. API pública de Cfx.re con el código de conexión (sin secretos).
#   2. Consulta directa al servidor, SOLO si existe el secreto
#      FIVEM_ENDPOINT (formato ip:puerto). La dirección no se escribe
#      en este archivo ni aparece en los registros.
#      Se configura en: Settings → Secrets and variables → Actions →
#      New repository secret → Nombre: FIVEM_ENDPOINT.
#
#  estado.json solo publica: en_linea, jugadores, tope y actualizado.
# ════════════════════════════════════════════════════════════
name: Estado del servidor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado
  cancel-in-progress: true

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar el servidor
        shell: bash
        env:
          JOIN: kr546a                                # código público de Cfx.re
          FIVEM_ENDPOINT: ${{ secrets.FIVEM_ENDPOINT }} # opcional, nunca se imprime
        run: |
          set +e                      # ningún fallo corta la consulta
          CLIENTS=""; MAX=""

          # La dirección directa, si existe, queda enmascarada en los registros
          if [ -n "$FIVEM_ENDPOINT" ]; then
            echo "::add-mask::$FIVEM_ENDPOINT"
            echo "::add-mask::${FIVEM_ENDPOINT%%:*}"
          fi

          echo "── 1. API de Cfx.re ──"
          CODE=$(curl -s -m 20 -A "ElysiumEstado/1.0" -o cfx.json -w "%{http_code}" \
                 "https://servers-frontend.fivem.net/api/servers/single/$JOIN" 2>/dev/null)
          echo "Respuesta HTTP: ${CODE:-sin respuesta}"
          if [ "$CODE" = "200" ]; then
            CLIENTS=$(jq -r '.Data.clients // empty' cfx.json 2>/dev/null)
            MAX=$(jq -r '.Data.sv_maxclients // .Data.svMaxclients // empty' cfx.json 2>/dev/null)
          elif [ "$CODE" = "404" ]; then
            echo "El código no figura en el listado público (servidor apagado, oculto o con otro código)."
          fi

          if [ -z "$CLIENTS" ] && [ -n "$FIVEM_ENDPOINT" ]; then
            echo "── 2. Consulta directa (dirección protegida) ──"
            C=$(curl -s -m 20 -o dynamic.json -w "%{http_code}" "http://$FIVEM_ENDPOINT/dynamic.json" 2>/dev/null)
            echo "Respuesta HTTP: ${C:-sin respuesta}"
            if [ "$C" = "200" ]; then
              CLIENTS=$(jq -r '.clients // empty' dynamic.json 2>/dev/null)
              MAX=$(jq -r '.sv_maxclients // empty' dynamic.json 2>/dev/null)
            fi
          elif [ -z "$CLIENTS" ]; then
            echo "Sin secreto FIVEM_ENDPOINT: no se hace la consulta directa."
          fi

          # Solo números: nada de texto del servidor llega a estado.json
          case "$CLIENTS" in ''|*[!0-9]*) CLIENTS="" ;; esac
          case "$MAX" in ''|*[!0-9]*) MAX="" ;; esac

          AHORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -z "$CLIENTS" ]; then
            echo "Veredicto: ninguna vía respondió."
            jq -cn --arg t "$AHORA" '{en_linea: false, actualizado: $t}' > estado.json
          else
            echo "Veredicto: en línea con $CLIENTS personas conectadas."
            jq -cn --argjson j "$CLIENTS" --argjson m "${MAX:-64}" --arg t "$AHORA" \
              '{en_linea: true, jugadores: $j, tope: $m, actualizado: $t}' > estado.json
          fi
          echo "${CLIENTS:-vacio}" > .jugadores
          rm -f cfx.json dynamic.json
          exit 0

      - name: Publicar solo si cambió el número
        shell: bash
        run: |
          set +e
          NUEVO=$(cat .jugadores); rm -f .jugadores
          VIEJO=$(git show HEAD:estado.json 2>/dev/null | jq -r '.jugadores // "vacio"' 2>/dev/null)
          [ -z "$VIEJO" ] && VIEJO="sin-archivo"

          if [ "$NUEVO" = "$VIEJO" ]; then
            echo "Sigue en $NUEVO: no hace falta publicar."
            exit 0
          fi
          git config user.name  "Elysium bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "Estado: $NUEVO jugadores"
          git push || { git pull --rebase && git push; }
          exit 0
