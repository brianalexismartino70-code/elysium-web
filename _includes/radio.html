{%- comment -%}
  Elysium FM. Solo se muestra si _data/radio.yml tiene pistas con licencia.
{%- endcomment -%}
{%- if site.data.radio.pistas and site.data.radio.pistas.size > 0 -%}
<div class="radio" id="radio" data-pistas='{{ site.data.radio.pistas | jsonify | escape }}'>
  <button class="radio-toggle" id="radioToggle" type="button" aria-expanded="false" aria-controls="radioBody" aria-label="Abrir la radio de Elysium">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 13.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm0-4.4a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
  </button>
  <div class="radio-body" id="radioBody">
    <div class="radio-meta"><span class="k">Elysium FM</span><span class="v" id="track">Radio en pausa</span></div>
    <button class="radio-btn" id="playBtn" type="button" aria-label="Reproducir">{% include icono.html n="play" %}</button>
    <button class="radio-btn" id="nextBtn" type="button" aria-label="Siguiente pista">{% include icono.html n="derecha" %}</button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.3" aria-label="Volumen">
  </div>
  <audio id="audio" preload="none"></audio>
</div>
{%- endif -%}
