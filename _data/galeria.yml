# ════════════════════════════════════════════════════════════
#  Galería de la portada.
#  tipo: arte (arte de marca) | concepto (ilustración conceptual) | captura
#  Usá "captura" SOLO para imágenes tomadas dentro del servidor de Elysium,
#  con permiso de quien aparece. No uses capturas de otros servidores ni
#  imágenes descargadas de internet.
#  "base" apunta a variantes -640/-1280 (.avif y .webp); "src" es una
#  imagen única y "full", la versión grande para el visor.
#  Las ilustraciones de esta lista las genera tools/arte/generar_arte.py.
# ════════════════════════════════════════════════════════════
