# ════════════════════════════════════════════════════════════
#  Los cuatro mundos de Elysium.
#  estado: reapertura | abierto | confirmar | desarrollo | diseno
#  No marques un mundo como "abierto" hasta comprobar que cualquier
#  persona puede entrar. Lo que todavía es diseño se presenta como
#  "previsto", nunca como algo que ya funciona.
#  Las imágenes son ilustraciones conceptuales, no capturas del servidor.
# ════════════════════════════════════════════════════════════

- numero: "I"
  nombre: "Roleplay"
  estado: reapertura
  imagen: /assets/img/mundos/mundo-1-1600.webp
  base: /assets/img/mundos/mundo-1
  miniatura: /assets/img/mundos/mundo-1-480.webp
  alt: "Ilustración conceptual del Mundo I: una avenida de la ciudad al atardecer, con edificios iluminados y estelas de autos"
  resumen: "La ciudad de rol serio, en reapertura."
  texto: "La ciudad de siempre, ahora en reapertura: vida civil, facciones, trabajo y economía según la normativa publicada, con consecuencias que quedan en la historia de tu personaje. Es el corazón del proyecto. Cada sistema se confirma antes de anunciarlo como disponible."
  datos:
    - ["Etapa", "Reapertura"]
    - ["Acceso público", "Por confirmar"]
    - ["Normativa", "Publicada y completa"]

- numero: "II"
  nombre: "Cuarentena"
  estado: confirmar
  imagen: /assets/img/mundos/mundo-2-1600.webp
  base: /assets/img/mundos/mundo-2
  miniatura: /assets/img/mundos/mundo-2-480.webp
  alt: "Ilustración conceptual del Mundo II: un alambrado frente a una zona de cuarentena con carpas, barreras y un reflector en la niebla"
  resumen: "Supervivencia contra hordas. Diseño previsto, sin fecha."
  texto: "Supervivencia contra hordas. El diseño previsto: se entra por el campamento militar, solo o en grupo; diez hordas para salir con vida, pactos que dan un beneficio a cambio de una maldición y una segunda arena dentro de Humane Labs para quienes ya ganaron. Es un proyecto: su estado y su fecha no están confirmados y los detalles pueden cambiar."
  datos:
    - ["Estado", "Por confirmar"]
    - ["Grupo previsto", "De 1 a 5 jugadores"]
    - ["Fecha", "Sin anunciar"]

- numero: "III"
  nombre: "PvP"
  estado: desarrollo
  imagen: /assets/img/mundos/mundo-3-1600.webp
  base: /assets/img/mundos/mundo-3
  miniatura: /assets/img/mundos/mundo-3-480.webp
  alt: "Ilustración conceptual del Mundo III: un patio de contenedores de noche, cruzado por reflectores y chispas"
  resumen: "Combate por rondas. Proyecto posterior."
  texto: "Combate puro, con lobby, modos de juego y recompensas propias. Sin rol de por medio y sin nada que cruce hacia la ciudad. Es un proyecto posterior a la reapertura del Mundo I."
  datos:
    - ["Estado", "En desarrollo"]
    - ["Formato previsto", "Por rondas"]
    - ["Fecha", "Sin anunciar"]

- numero: "IV"
  nombre: "Arena"
  nota: "Nombre provisional"
  estado: diseno
  imagen: /assets/img/mundos/mundo-4-1600.webp
  base: /assets/img/mundos/mundo-4
  miniatura: /assets/img/mundos/mundo-4-480.webp
  alt: "Ilustración conceptual del Mundo IV: un coliseo futurista con gradas iluminadas y un haz de luz en el centro"
  resumen: "Personajes fuera de lo humano. En diseño."
  texto: "Peleas organizadas entre personajes fuera de lo humano, con torneos anunciados por Discord. Es un proyecto en diseño: el nombre y el formato definitivos están por confirmar."
  datos:
    - ["Estado", "En diseño"]
    - ["Formato previsto", "Torneos"]
    - ["Fecha", "Sin anunciar"]
