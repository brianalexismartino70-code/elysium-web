# ════════════════════════════════════════════════════════════
#  Datos generales del sitio. Cambiá acá, no en cada página.
# ════════════════════════════════════════════════════════════

# ── Etapa pública del proyecto ─────────────────────────────
# Es el mensaje que ve la gente. Valores posibles:
#   reapertura    → Elysium vuelve después de haber estado abierto
#   abierto       → funcionamiento normal, con acceso público comprobado
#   mantenimiento → cerrado temporalmente
# La etapa NO dice si el servidor acepta conexiones: eso va en "acceso".
etapa: reapertura

etapas:
  reapertura:
    etiqueta: "Reapertura"
    titulo: "ELYSIUM | ES vuelve a abrir"
    texto: "Elysium está en reapertura. El acceso público y el código de conexión se confirman en el Discord oficial y en esta web."
  abierto:
    etiqueta: "Abierto"
    titulo: "La ciudad está abierta"
    texto: "Conseguí GTA V, instalá FiveM y conectate con el código oficial."
  mantenimiento:
    etiqueta: "En mantenimiento"
    titulo: "Volvemos pronto"
    texto: "El servidor está en mantenimiento. Las novedades se publican en el Discord oficial."

# ── Acceso verificado ──────────────────────────────────────
# Datos comprobados, independientes de la etapa. Cambialos solo
# después de verificarlos (ver DECISIONES_PENDIENTES_WEB.md, punto 1).
#   publico: true cuando cualquier persona con GTA V y FiveM puede entrar.
#   codigo_confirmado: true cuando cfx.re/join/<codigo> lleva al servidor.
#     Mientras sea false, la web no muestra el comando ni el botón
#     "Abrir en FiveM": remite al Discord oficial.
# Último control: 28/10/2026, 02:07 UTC. La API pública de Cfx.re respondió
# 404 para kr546a (también el 15/09 y el 27/10/2026). El 27/10 el servidor
# se identificaba como "PREAPERTURA (solo STAFF)".
acceso:
  publico: false
  codigo: "kr546a"
  codigo_confirmado: false
  verificado: "2026-10-28"

# Video de fondo de la portada (opcional). Solo material propio grabado en
# Elysium, con permiso de quien aparezca (ver docs/GUION_VIDEOS.md).
# Vacío = la portada usa solo su imagen. Nunca se descarga en pantallas
# chicas, con ahorro de datos ni con "menos movimiento".
portada:
  # Arte principal de la portada (por ejemplo, la ilustración de personajes de docs/DIRECCION_ARTE.md).
  # Mientras esté vacío, se usa la escena 3D en dos capas como fondo.
  arte_escritorio: ""   # ej.: /assets/img/portada/arte-2560.webp (16:9)
  arte_movil: ""        # ej.: /assets/img/portada/arte-movil-1080.webp (4:5)
  video_mp4: ""       # ej.: /assets/video/portada.mp4 (máx. 2 MB)
  video_webm: ""      # ej.: /assets/video/portada.webm
  poster: ""          # ej.: /assets/video/portada-poster.webp

# Estado en vivo: lo publica la acción "Estado del servidor" en estado.json.
estado:
  # Por debajo de este número de personas conectadas no se muestra la cifra.
  minimo_visible: 1
  # Pasadas estas horas sin datos nuevos, el estado se muestra como antiguo.
  horas_validez: 12

enlaces:
  discord: "https://discord.gg/4mTVJhu3gx"
  # Canal donde se reciben las postulaciones a staff (dato del propietario, 28/10/2026).
  # El enlace funciona para quien ya entró al servidor de Discord.
  postulaciones: "https://discord.com/channels/1484725476785393816/1494480100865872043"
  tienda: "https://elysium-488.tebex.io"

redes:
  - nombre: "Discord"
    icono: discord
    url: "https://discord.gg/4mTVJhu3gx"
    usuario: "Servidor oficial"
  - nombre: "TikTok"
    icono: tiktok
    url: "https://www.tiktok.com/@elysiumes.rp"
    usuario: "@elysiumes.rp"
  - nombre: "Instagram"
    icono: instagram
    url: "https://www.instagram.com/elysiumes"
    usuario: "@elysiumes"
  - nombre: "YouTube"
    icono: youtube
    url: "https://www.youtube.com/@ElysiumES"
    usuario: "@ElysiumES"

# Postulación a staff. "descarga": la persona descarga sus respuestas y las
# adjunta en un ticket de Discord. No hay envío automático (ver decisiones).
staff_envio: descarga

# Decoración de temporada: se enciende sola entre "desde" y "hasta" (fecha del visitante).
# Para apagarla, poné activa: false. Es solo decoración: no anuncia eventos ni fechas.
temporada:
  activa: true
  nombre: halloween
  desde: "2026-10-24"
  hasta: "2026-11-02"
