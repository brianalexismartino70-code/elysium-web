# ════════════════════════════════════════════════════════════
#  Sistemas de rol del Mundo I.
#  Cada punto sale de la normativa publicada o de textos propios de
#  Elysium (se cita la fuente). No agregues sistemas que solo existan
#  en un documento de diseño.
#
#  estado: disponible | pruebas | desarrollo | confirmar
#  Mientras el servidor esté en preapertura, nada está "disponible"
#  para el público: el equipo debe confirmar cada uno antes de abrir.
#
#  ref: ancla de la normativa (normativa.html#art-X-Y o #cap-N)
# ════════════════════════════════════════════════════════════

categorias:
  civil: "Vida civil"
  orden: "Ley y orden"
  economia: "Economía"
  calle: "Calle"
  comunidad: "Comunidad"

lista:
  - id: empleos
    nombre: "Empleos y trayectoria"
    categoria: civil
    icono: maletin
    estado: confirmar
    texto: "Trabajos legales con rutas propias y un personaje que no se reinicia: su historial, sus antecedentes y su reputación se acumulan."
    puntos:
      - texto: "Rutas laborales de basureros, carteros y repartidores, protegidas mientras trabajan."
        ref: art-9-2
        fuente: "Art. 9.2.2"
      - texto: "Ofertas de empleo publicadas en los anuncios de la ciudad."
        ref: art-8-3
        fuente: "Art. 8.3.1"

  - id: facciones
    nombre: "Facciones y organizaciones"
    categoria: orden
    icono: escudo
    estado: confirmar
    texto: "Facciones legales de servicio y bandas organizadas, cada una con sus herramientas y sus límites."
    puntos:
      - texto: "LSPD, EMS y mecánicos, con uniformes reservados a sus miembros."
        ref: art-7-3
        fuente: "Art. 7.3.3"
      - texto: "Frecuencias de radio propias para facciones legales y bandas organizadas."
        ref: art-8-2
        fuente: "Art. 8.2.1"
      - texto: "Salir expulsado de una organización ilegal puede implicar un PKT."
        ref: art-4-2
        fuente: "Art. 4.2"

  - id: economia
    nombre: "Economía y negocios"
    categoria: economia
    icono: balanza
    estado: confirmar
    texto: "Un banco con reglas, préstamos entre personas con contrato y límites pensados para no ahogar a quien recién llega."
    puntos:
      - texto: "Préstamos bancarios automáticos, con embargo de bienes si no se pagan."
        ref: art-10-1
        fuente: "Art. 10.1.1"
      - texto: "Préstamos entre particulares documentados, con un interés máximo del 25 % semanal."
        ref: art-10-2
        fuente: "Art. 10.1.2 y 10.2.2"
      - texto: "Anuncios para abrir negocios; lo ilegal circula por mercado negro."
        ref: art-8-3
        fuente: "Art. 8.3"

  - id: vehiculos
    nombre: "Vehículos y mecánica"
    categoria: civil
    icono: volante
    estado: confirmar
    texto: "Garajes, talleres y reglas claras sobre cómo se maneja en una ciudad que se toma en serio."
    puntos:
      - texto: "Garajes centrales considerados zona segura."
        ref: art-6-1
        fuente: "Art. 6.1.3"
      - texto: "Mecánicos como facción de servicio."
        ref: art-7-3
        fuente: "Art. 7.3.3"
      - texto: "Nada de conducir por montañas en un deportivo ni de usar el auto como arma."
        ref: art-3-2
        fuente: "Art. 2.2 y 3.2"

  - id: propiedades
    nombre: "Propiedades y bienes"
    categoria: civil
    icono: llave
    estado: confirmar
    texto: "Lo que tu personaje tiene queda a su nombre, y también responde por sus deudas y sus decisiones."
    puntos:
      - texto: "Los bienes pueden embargarse por deudas con el banco."
        ref: art-10-1
        fuente: "Art. 10.1.1"
      - texto: "Una muerte definitiva (CK) elimina propiedades, dinero y jerarquía."
        ref: art-4-3
        fuente: "Art. 4.3"

  - id: social
    nombre: "Comunicación y vida social"
    categoria: civil
    icono: voz
    estado: confirmar
    texto: "La voz como herramienta principal, con radio, teléfono y prensa dentro del rol."
    puntos:
      - texto: "Voz por proximidad, con tono y volumen coherentes con la escena."
        ref: art-8-1
        fuente: "Art. 8.1"
      - texto: "Radio y teléfono como objetos que se pueden confiscar durante un cacheo."
        ref: art-8-2
        fuente: "Art. 8.2.2"
      - texto: "Acciones y entorno descritos con /me y /do."
        ref: cap-5
        fuente: "Cap. V"

  - id: emergencias
    nombre: "Emergencias y justicia"
    categoria: orden
    icono: sirena
    estado: confirmar
    texto: "Líneas de emergencia, hospitales, comisarías y centros judiciales que sostienen el orden de la ciudad."
    puntos:
      - texto: "Llamadas al /911 y al /311, claras y descriptivas."
        ref: art-8-2
        fuente: "Art. 8.2.3"
      - texto: "Hospitales, comisarías y centros judiciales como zonas seguras."
        ref: art-6-1
        fuente: "Art. 6.1"
      - texto: "El EMS en servicio no se secuestra ni se mata."
        ref: art-9-2
        fuente: "Art. 9.2.1"

  - id: calle
    nombre: "Rol ilegal y secuestros"
    categoria: calle
    icono: mascara
    estado: confirmar
    texto: "El inframundo tiene reglas: motivos, tiempos, topes y respeto por la otra persona."
    puntos:
      - texto: "Secuestros con negociación y robos a banco con un mínimo de cuatro oficiales en servicio."
        ref: art-9-1
        fuente: "Art. 9.1.1"
      - texto: "Topes de rescate y tiempos de retención según el tipo de víctima."
        ref: limites-de-rescate
        fuente: "Cap. IX"
      - texto: "Máscaras solo en rol ilegal o en eventos."
        ref: art-7-3
        fuente: "Art. 7.3.2"

  - id: eventos
    nombre: "Eventos y tramas"
    categoria: comunidad
    icono: estandarte
    estado: confirmar
    texto: "Historias que le dan a la ciudad algo que hacer cuando el rol se estanca."
    puntos:
      - texto: "La postulación a staff incluye el rol de Playmaker, dedicado a crear y dirigir eventos y tramas."
        enlace: /staff.html
        fuente: "Postulación a staff"
      - texto: "Eventos públicos difundidos por los anuncios de la ciudad."
        ref: art-8-3
        fuente: "Art. 8.3.1"

  - id: soporte
    nombre: "Inventario y soporte"
    categoria: comunidad
    icono: mochila
    estado: confirmar
    texto: "Una base técnica revisada recurso por recurso y un canal de soporte que deja registro."
    puntos:
      - texto: "Base QBox con inventario y objetivos de ox, según el equipo técnico de Elysium."
        fuente: "Equipo técnico"
      - texto: "Soporte, reportes y apelaciones por ticket en el Discord oficial."
        enlace: /moderacion.html
        fuente: "Normas de comunidad"
